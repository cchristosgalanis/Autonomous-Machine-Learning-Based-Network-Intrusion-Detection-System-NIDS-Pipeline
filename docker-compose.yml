services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ids-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

# kafka service initialization
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ids-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # database service with TimescaleDB (PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: ids-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./database/events.sql:/docker-entrypoint-initdb.d/events.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

# producer service 
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: ids-sniffer-producer
    network_mode: "host"   
    privileged: true       
    environment:
      - INTERFACE=${INTERFACE}     
      - PYTHONUNBUFFERED=1
    command: ["python3", "Producer_kafka.py", "-i", "${INTERFACE}"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

# volumetric consumer
  consumer-volumetric:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-volumetric
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs   
    command: ["python3", "Consumer_Vol_kafka.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

# stealth consumer 
  consumer-stealth:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-stealth
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    command: ["python3", "Consumer_St_kafka.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

# spatial analysis consumer
  consumer-spatial:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-spatial
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    command: ["python3", "Consumer_Spatial.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

# neural network consumer for MLP model training and inference
  consumer-mlp:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-mlp
    environment:
      - HOST_IP=${HOST_IP}
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
       # Credentials for database connection
      - DB_HOST=timescaledb
      - DB_USER=postgres
      - DB_PASS=yourpassword
      - DB_NAME=postgres
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models 
    command: ["python3", "Consumer_MLP.py"]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

# sanitization service for cleaning and labeling 
  sanitization-service:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-sanitization-service
    environment:
      - PYTHONUNBUFFERED=1
      # Credentials for database connection
      - HOST_IP=${HOST_IP}
      - DB_HOST=timescaledb
      - DB_USER=postgres
      - DB_PASS=yourpassword
      - DB_NAME=postgres
    volumes:
      - ./logs:/app/logs      
      - ./models:/app/models  
    command: ["python3", "sanitization_service.py"]
    depends_on:
      - consumer-mlp
      - timescaledb
    restart: unless-stopped

# adaptive learning service  | background process 
  adaptive-learning:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-adaptive-learning
    environment:
      - PYTHONUNBUFFERED=1
      # credentials for database connection
      - DB_HOST=timescaledb
      - DB_USER=postgres
      - DB_PASS=yourpassword
      - DB_NAME=postgres
    volumes:
      - ./models:/app/models  
    command: ["/bin/sh", "-c", "while true; do sleep 450; python3 adaptive_learning.py; done"] # change  sleep duration as needed so if per day, use 86400 seconds
    depends_on:
      - sanitization-service
      - timescaledb
    restart: unless-stopped

# frontend dashboard for datas visualization and real-time monitoring
  frontend-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ids-frontend-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs:ro  # Read-only access to logs
    depends_on:
      - consumer-mlp
    restart: unless-stopped

# volume for TimescaleDB data persistence
volumes:
  timescaledb_data: