services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ids-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ids-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: ids-sniffer-producer
    network_mode: "host"   
    privileged: true       
    environment:
      - INTERFACE=${INTERFACE}     
      - PYTHONUNBUFFERED=1
    command: ["python3", "Producer_kafka.py", "-i", "${INTERFACE}"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer-volumetric:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-volumetric
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs   
    command: ["python3", "Consumer_Vol_kafka.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer-stealth:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-stealth
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    command: ["python3", "Consumer_St_kafka.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer-spatial:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: ids-consumer-spatial
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    command: ["python3", "Consumer_Spatial.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped